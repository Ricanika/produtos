# ---------------------------------------------------------------------------
# Cesto Mini Organizador P (200 x 250 x 130 mm) -- PETG, bico 0,4 mm
# Perfil escrito para o proprio solido do projeto: a espessura de parede do
# CAD (1,4 mm) e reproduzida por 3 perimetros de 0,47 (1,41 mm), e o
# preenchimento de 100% garante que as regioes mais grossas -- a faixa do rim
# (3,2 mm) e a saia de tras (4 mm) -- saiam cheias como no desenho.
#
# CAMA: 300 x 300 mm. Se a sua for menor, veja as notas no fim do arquivo.
# ---------------------------------------------------------------------------
printer_technology = FFF
# Klipper, nao Marlin: as Kobra 3 / S1 / 3 Max rodam um fork de Klipper.
gcode_flavor = klipper
# Cama do MENOR dos tres modelos (S1, 250x250). Centrado nela, o arquivo vale
# tambem na Kobra 3 (255x255) e na 3 Max (426x420).
bed_shape = 0x0,250x0,250x250,0x250
max_print_height = 250
# A tela da impressora mostra a miniatura; e o formato que o perfil oficial usa.
thumbnails = 230x110
thumbnails_format = PNG
nozzle_diameter = 0.4
filament_diameter = 1.75
filament_type = PETG
filament_density = 1.27
filament_cost = 120
extrusion_multiplier = 0.95
# E RELATIVO: o start_gcode manda M83, entao o gcode tem de sair em passos
# relativos. Sem esta linha o PrusaSlicer escreve E absoluto e a impressora,
# em M83, soma tudo -- super-extrusao imediata.
use_relative_e_distances = 1
# E relativo exige zerar o extrusor a cada camada, senao a precisao de ponto
# flutuante se degrada ao longo de 440 camadas (o proprio PrusaSlicer recusa
# fatiar sem isto).
layer_gcode = G92 E0

# --- temperaturas (PETG) ---------------------------------------------------
temperature = 240
first_layer_temperature = 245
bed_temperature = 80
first_layer_bed_temperature = 80

# --- camadas e paredes -----------------------------------------------------
layer_height = 0.3
first_layer_height = 0.3
perimeters = 6
extrusion_width = 0.47
first_layer_extrusion_width = 0.5
perimeter_extrusion_width = 0.47
external_perimeter_extrusion_width = 0.45
solid_infill_extrusion_width = 0.47
top_infill_extrusion_width = 0.45
thin_walls = 1
gap_fill_enabled = 1
fill_density = 100%
fill_pattern = rectilinear
top_solid_layers = 4
bottom_solid_layers = 4

# --- velocidades (PETG pede calma nos perimetros externos) -----------------
perimeter_speed = 40
external_perimeter_speed = 25
small_perimeter_speed = 25
infill_speed = 50
solid_infill_speed = 45
top_solid_infill_speed = 30
first_layer_speed = 20
travel_speed = 150
bridge_speed = 25
support_material_speed = 40

# --- retracao (PETG fia; retracao longa e wipe) ----------------------------
retract_length = 2
retract_speed = 35
deretract_speed = 25
retract_lift = 0.2
retract_before_travel = 2
wipe = 1
retract_before_wipe = 70%

# --- resfriamento ----------------------------------------------------------
cooling = 1
fan_always_on = 1
min_fan_speed = 40
max_fan_speed = 60
bridge_fan_speed = 80
disable_fan_first_layers = 3
slowdown_below_layer_time = 8
min_print_speed = 15

# --- aderencia -------------------------------------------------------------
brim_width = 2
brim_type = outer_only
skirts = 0

# --- SUPORTE: so nas 18 primeiras camadas ----------------------------------
# A chapa do fundo fica 5 mm acima do piso (a peca apoia nos pes, nao na
# parede). Sem suporte esses 5 mm viram uma ponte de 145 x 195 mm -- nao
# fecha. Mas o suporte AUTOMATICO, mesmo com "buildplate only", enchia o
# cesto inteiro de torre: medido, 260 g de suporte para 196 g de peca, e 16 h
# a mais. A solucao e desligar o automatico e FORCAR suporte so nas 18
# primeiras camadas (18 x 0,3 = 5,4 mm), que e exatamente o vao embaixo da
# chapa. O resto da peca imprime sem suporte nenhum.
support_material = 1
support_material_auto = 0
support_material_enforce_layers = 18
support_material_buildplate_only = 1
support_material_threshold = 50
support_material_contact_distance = 0.2
support_material_spacing = 3
support_material_pattern = rectilinear
support_material_xy_spacing = 80%
support_material_interface_layers = 2

# --- start / end: macros DA MAQUINA, nao inventados por mim ---------------
# G9111 e o macro de partida da Anycubic: ele faz homing, aquecimento e
# nivelamento por dentro. E a ausencia dele que dispara o erro 10133 ("the
# file is missing necessary commands") -- a firmware valida o arquivo antes de
# imprimir. Copiado do perfil de Anycubic do OrcaSlicer, que e mantido por
# quem conhece a maquina; os tres modelos novos usam exatamente esta linha.
# Sem purga manual e sem G28 aqui: quem faz isso e o G9111.
# M900 (pressure advance) foi omitido de proposito -- ele esta no perfil da
# Kobra 3 mas nao no da S1, e um valor errado estraga o canto.
start_gcode = G9111 bedTemp=[first_layer_bed_temperature] extruderTemp=[first_layer_temperature]\nM117
end_gcode = M400\nG92 E0\nG1 E-2 F3600\nG91\nG1 Z5 F900\nG90\nM140 S0\nM104 S0\nM107\nG1 X10 Y10 F6000\nM84
